<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Banana RPG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to Milky Banana RPG</h1>
    <div id="battle-area">
        <h2>Turn-Based Battle System</h2>
        <div id="sprites">
            <img src="improved-milk-jug-sprite.png" alt="Milk Jug Character" />
            <img src="improved-banana-sprite.png" alt="Banana Character" />
        </div>
        <div id="battle-feedback">
            <p id="status-message">Prepare for battle!</p>
            <div id="actions">
                <!-- Actions will be dynamically generated here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
