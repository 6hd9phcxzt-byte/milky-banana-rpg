<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milky & Banana RPG</title>
<style>
body { margin:0; background:#111; color:white; font-family:monospace; text-align:center; }
canvas { image-rendering:pixelated; background:black; display:block; margin:auto; }
button { width:90px; height:44px; margin:4px; font-size:12px; }
</style>
</head>
<body>

<canvas id="game" width="256" height="256"></canvas>

<div id="controls"></div>

<script>
/* ================= CORE ================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.font="10px monospace";
const tile=16;
let mode="world", steps=0;
let player={x:7,y:7};
let battleText="";

/* ================= AUDIO ================= */
const AC=window.AudioContext||window.webkitAudioContext;
const audio=new AC();
function beep(f,d){let o=audio.createOscillator(),g=audio.createGain();
o.type="square";o.frequency.value=f;o.connect(g);g.connect(audio.destination);
g.gain.value=0.05;o.start();o.stop(audio.currentTime+d);}
const sfx={
attack:()=>beep(440,0.07),
special:()=>beep(220,0.12),
enemy:()=>beep(110,0.1),
win:()=>{beep(660,0.1);setTimeout(()=>beep(880,0.1),120)},
level:()=>{beep(880,0.08);setTimeout(()=>beep(1320,0.12),100)}
};

/* ================= SAVE ================= */
function saveGame(){
localStorage.setItem("MB_SAVE",JSON.stringify({party,player}));
}
function loadGame(){
let d=localStorage.getItem("MB_SAVE");
if(!d) return;
d=JSON.parse(d);
party=d.party; player=d.player;
}

/* ================= PARTY ================= */
let party={
milky:{name:"Milky",lvl:1,xp:0,next:20,hp:30,maxHp:30,mp:10,maxMp:10,atk:5,acted:false},
banana:{name:"Banana",lvl:1,xp:0,next:20,hp:25,maxHp:25,mp:8,maxMp:8,atk:6,acted:false}
};
let enemy={};

/* ================= PIXEL ART ================= */
function drawMilky(x,y){
ctx.fillStyle="#fff";ctx.fillRect(x,y,12,12);
ctx.fillStyle="#ccc";ctx.fillRect(x+3,y-3,6,3);
}
function drawBanana(x,y){
ctx.strokeStyle="#ffe135";ctx.lineWidth=3;
ctx.beginPath();ctx.arc(x+6,y+6,6,Math.PI*0.2,Math.PI*1.2);ctx.stroke();
}
function drawEnemy(x,y){
ctx.fillStyle="#ff4d4d";ctx.beginPath();ctx.arc(x+8,y+8,8,0,Math.PI*2);ctx.fill();
}

/* ================= DRAW ================= */
function drawWorld(){
ctx.fillStyle="#3a7d44";ctx.fillRect(0,0,256,256);
drawMilky(64,64); drawBanana(160,96);
ctx.fillStyle="#4da6ff";ctx.fillRect(player.x*tile,player.y*tile,16,16);
}

function drawBattle(){
ctx.fillStyle="black";ctx.fillRect(0,0,256,256);
ctx.fillStyle="white";
ctx.fillText("MILKY & BANANA VS "+enemy.name,40,12);
drawMilky(40,60); drawBanana(80,60); drawEnemy(170,60);
bars(10,200,party.milky); bars(90,200,party.banana); enemyBar(150,50);
ctx.strokeRect(8,140,240,40);
ctx.fillText(battleText,12,162);
}

function bars(x,y,c){
ctx.fillText(`${c.name} Lv${c.lvl}`,x,y-6);
ctx.strokeRect(x,y,60,6);
ctx.fillStyle="lime";ctx.fillRect(x,y,(c.hp/c.maxHp)*60,6);
ctx.strokeRect(x,y+8,60,4);
ctx.fillStyle="cyan";ctx.fillRect(x,y+8,(c.mp/c.maxMp)*60,4);
}

function enemyBar(x,y){
ctx.fillText(enemy.name,x,y-4);
ctx.strokeRect(x,y,80,6);
ctx.fillStyle="red";ctx.fillRect(x,y,(enemy.hp/enemy.maxHp)*80,6);
}

/* ================= GAME FLOW ================= */
function move(dx,dy){
if(mode!=="world")return;
player.x=Math.max(0,Math.min(15,player.x+dx));
player.y=Math.max(0,Math.min(15,player.y+dy));
steps++;
if(Math.random()<0.25&&steps>3){startBattle();steps=0;}
draw();
}

function startBattle(){
mode="battle";
enemy={name:"Evil Smoothie",hp:34,maxHp:34,atk:6};
party.milky.acted=false; party.banana.acted=false;
battleText="A wild Evil Smoothie appears!";
controlsBattle();
draw();
}

function controlsBattle(){
controls.innerHTML=`
<button onclick="attack('milky')">MILKY</button>
<button onclick="milkSplash()">SPLASH</button><br>
<button onclick="attack('banana')">BANANA</button>
<button onclick="bananaSlam()">SLAM</button>`;
}

function attack(w){
let a=party[w];
enemy.hp-=a.atk;
battleText=a.name+" attacks!";
sfx.attack();
a.acted=true; afterAction();
}

function milkSplash(){
let m=party.milky;
enemy.hp-=8; m.hp=Math.min(m.maxHp,m.hp+4); m.mp-=3;
battleText="Milk Splash!";
sfx.special();
m.acted=true; afterAction();
}

function bananaSlam(){
let b=party.banana;
enemy.hp-=12; b.mp-=4;
battleText="BANANA SLAM!";
sfx.special();
b.acted=true; afterAction();
}

function afterAction(){
if(enemy.hp<=0){endBattle();return;}
if(party.milky.acted&&party.banana.acted) enemyTurn();
draw();
}

function enemyTurn(){
let t=Math.random()<0.5?party.milky:party.banana;
t.hp-=enemy.atk;
battleText="Enemy attacks!";
sfx.enemy();
party.milky.acted=false; party.banana.acted=false;
draw();
}

function gainXP(c){
c.xp+=10;
if(c.xp>=c.next){
c.xp=0; c.lvl++; c.next+=10;
c.maxHp+=5; c.maxMp+=2; c.atk+=1;
c.hp=c.maxHp; c.mp=c.maxMp;
battleText=c.name+" leveled up!";
sfx.level();
}
}

function endBattle(){
gainXP(party.milky); gainXP(party.banana);
sfx.win(); saveGame();
setTimeout(()=>{
mode="world"; controlsWorld(); draw();
},800);
}

/* ================= CONTROLS ================= */
const controls=document.getElementById("controls");
function controlsWorld(){
controls.innerHTML=`
<button onclick="move(0,-1)">â¬ï¸</button><br>
<button onclick="move(-1,0)">â¬ï¸</button>
<button onclick="move(1,0)">â¡ï¸</button><br>
<button onclick="move(0,1)">â¬ï¸</button>`;
}

/* ================= START ================= */
loadGame();
controlsWorld();
draw();
</script>

</body>
</html>
